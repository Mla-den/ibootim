name: Build ibootim (macOS)

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install libpng
          # Force GCC/Clang to look in Homebrew's directories natively
          echo "C_INCLUDE_PATH=$(brew --prefix)/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> $GITHUB_ENV

      - name: Compile ibootim
        run: make

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibootim-macos
          path: ibootim
          if-no-files-found: error
